---
name: govulncheck

# Known-vulnerability scanning on two triggers: pull requests (so a
# dependency-changing PR is checked before merge) and a weekly schedule (so
# advisories published while the repo is idle still surface; a scheduled
# failure means the world changed, not the code). Off-peak cron minute per
# GitHub's guidance for scheduled workflows.

on:
  workflow_dispatch: {}
  pull_request: {}
  schedule:
    - cron: "43 4 * * 1"

permissions:
  contents: read

jobs:
  vulncheck:
    name: vulncheck
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod

      - name: Scan for known vulnerabilities
        run: make vulncheck
