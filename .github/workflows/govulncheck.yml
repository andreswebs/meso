---
name: govulncheck

# Known-vulnerability scanning on two triggers: pull requests (so a
# dependency-changing PR is checked before merge) and a weekly schedule (so
# advisories published while the repo is idle still surface; a scheduled
# failure means the world changed, not the code). Off-peak cron minute per
# GitHub's guidance for scheduled workflows.

on:
  workflow_dispatch: {}
  pull_request: {}
  schedule:
    - cron: "43 4 * * 1"

permissions:
  contents: read

jobs:
  vulncheck:
    name: vulncheck
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0

      - name: Set up Go
        uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6.5.0
        with:
          go-version-file: go.mod

      - name: Scan for known vulnerabilities
        run: make vulncheck
